services:
  # 백엔드 서버
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://imo_user:imo_pass@db:5432/imo_db
      - JWT_SECRET=dev_only_access_secret_change_me
      - JWT_REFRESH_SECRET=dev_only_refresh_secret_change_me
      - CORS_ORIGINS=*
    depends_on:
      - db
    # 개발 편의: 호스트 코드를 컨테이너에 마운트 → 코드 수정/마이그레이션 파일이
    # 즉시 양쪽에 반영. 운영(EC2) 배포 시에는 이 volumes 블록을 제거하거나
    # docker-compose.override.yml 로 분리할 것.
    volumes:
      - ./:/app
    networks:
      - imo_net

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: imo_user
      POSTGRES_PASSWORD: imo_pass
      POSTGRES_DB: imo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 스키마는 Alembic 마이그레이션이 관리한다 (entrypoint.sh 에서 실행).
      # backend_db_schema.sql 은 MySQL 문법 — Postgres 와 호환되지 않아 마운트하지 않음.
    networks:
      - imo_net

volumes:
  postgres_data:

networks:
  imo_net:
